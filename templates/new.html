{% extends 'base.html' %}
{% from '_macros.html' import author %}

{% block title %}새 글{% endblock %}

{% block content %}

    <form class="card compose" action="/posts/create" method="post">
        <div class="compose-header">
            <a href="/posts" class="text-btn">취소</a>
            <h1>새 게시물 만들기</h1>
            <button type="submit" class="post-btn">공유하기</button>
        </div>
        <div class="card-header">{{ author(user.username) }}</div>
        <textarea name="content" id="content" aria-label="문구" placeholder="문구를 입력하세요..." required autofocus></textarea>
    </form>
{% endblock %}
