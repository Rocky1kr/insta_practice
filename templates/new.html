{% extends 'base.html' %}

{% block title %}새 글{% endblock %}

{% block content %}

    <form class="card compose" action="/posts/create" method="post">
        <div class="compose-header">
            <a href="/posts" class="text-btn">취소</a>
            <h1>새 게시물 만들기</h1>
            <button type="submit" class="post-btn">공유하기</button>
        </div>
        <label for="content" class="card-header">
            <div class="avatar"><span>U</span></div>
            <span class="username">user</span>
        </label>
        <textarea name="content" id="content" placeholder="문구를 입력하세요..." required autofocus></textarea>
    </form>
{% endblock %}
