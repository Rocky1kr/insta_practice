<!DOCTYPE html>
{% from '_macros.html' import avatar %}
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}insta{% endblock %} · insta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/posts" class="logo">insta</a>
            <nav class="topbar-icons">
                <a href="/posts" aria-label="홈">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
                </a>
                {% if user %}
                    <!-- 로그인을 한경우 -->
                    <a href="/posts/new" aria-label="새 게시물">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
                    </a>
                    <span class="topbar-user" title="{{ user.username }}">
                        {{ avatar(user.username) }}
                    </span>
                    <form action="/logout" method="post">
                        <button type="submit" class="nav-btn muted">로그아웃</button>
                    </form>
                {% else %}
                    <!-- 로그인이 안된경우 -->
                    <a href="/login" class="primary-btn small-btn">로그인</a>
                    <a href="/signup" class="nav-btn">가입하기</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
