{% extends 'base.html' %}

{% block title %}수정하기{% endblock %}

{% block content %}

    <form class="card compose" action="/posts/{{post.id}}/update" method="post">
        <div class="compose-header">
            <a href="/posts/{{ post.id }}" class="text-btn">취소</a>
            <h1>정보 수정</h1>
            <button type="submit" class="post-btn">완료</button>
        </div>
        <label for="content" class="card-header">
            <div class="avatar"><span>U</span></div>
            <span class="username">user</span>
        </label>
        <textarea name="content" id="content" required autofocus>{{post.content}}</textarea>
    </form>
{% endblock %}
