{% extends 'base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}

  <div class="auth">
    <div class="auth-box">
      <span class="logo">insta</span>

      <form action="/login" method="post">
        <input type="text" id="username" name="username" placeholder="아이디" aria-label="아이디"
               value="{{ username or '' }}" autocomplete="username" required autofocus>
        <input type="password" id="password" name="password" placeholder="비밀번호" aria-label="비밀번호"
               autocomplete="current-password" required>
        <button type="submit" class="auth-submit">로그인</button>
      </form>

      {% if error %}
        <p class="auth-error">{{ error }}</p>
      {% endif %}
    </div>

    <div class="auth-switch">
      계정이 없으신가요? <a href="/signup">가입하기</a>
    </div>
  </div>

{% endblock %}
